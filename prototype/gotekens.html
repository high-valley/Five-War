<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>五手戦記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Antique&family=Press+Start+2P&display=swap">
<style>
/* Layout: a traveller's journal. The scene sits on top, the day's decisions or the duel's five visible moves below it. */
:root{
  --night:#10152f; --royal:#1d2a5c; --royal2:#31437f; --gold:#e0bd68; --vellum:#f3e8cf; --dim:#aeb5d3; --ink:#0c1026;
  --w:#9cc2ee; --h:#e8956a; --c:#94d6a4; --g:#c5b9e8; --x:#e0bd68; --foe:#4a1f35; --hp:#79dc8c; --bad:#ff9d8a;
  --title:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
  --jp:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --num:"Press Start 2P","DotGothic16",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--vellum);font-family:var(--jp);font-size:16px;line-height:1.55}
#app{max-width:480px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
h1,h2,p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--title);font-size:27px;letter-spacing:.16em;font-weight:400;color:var(--gold)}
.mini{font:inherit;font-size:13px;color:var(--vellum);background:var(--royal);border:1px solid var(--gold);padding:3px 9px;cursor:pointer}
.hud:empty{display:none}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st{min-width:0;display:flex;flex-direction:column;gap:3px;padding:6px 8px;border:1px solid var(--gold);background:var(--royal)}
.st.e{background:var(--foe)}
.st .r{display:flex;justify-content:space-between;gap:6px;font-size:13px;line-height:1.2}
.st .r span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{font-family:var(--num);font-size:9px;white-space:nowrap}
.b{height:6px;background:var(--ink);position:relative}
.b i{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .16s steps(4)}
.pips{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--dim)}
.pips i{width:9px;height:9px;background:var(--ink);display:block}
.pips i.on{background:var(--gold)}
.open{color:var(--bad);font-size:12px}
.day{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--gold);background:var(--royal)}
.day b{font-family:var(--num);font-size:12px;font-weight:400;color:var(--gold)}
.day .s{font-size:13px;color:var(--dim);text-align:right;white-space:nowrap}
.arena{position:relative;border:2px solid var(--gold);box-shadow:0 0 0 2px var(--ink);overflow:hidden;line-height:0}
canvas#stage{width:100%;height:auto;display:block;image-rendering:pixelated;aspect-ratio:16/9}
.cutin{position:absolute;left:0;right:0;top:33%;height:34%;background:var(--ink);border-block:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--title);font-size:clamp(24px,7.6vw,36px);letter-spacing:.14em;line-height:1;animation:cut .66s steps(9) both}
@keyframes cut{0%{transform:translateX(100%)}20%,82%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.call{position:absolute;top:7px;left:0;right:0;text-align:center;line-height:1.2;font-size:clamp(15px,4.6vw,20px);color:var(--vellum);text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}
.panel{display:flex;flex-direction:column;gap:11px}
.ch{font-size:13px;color:var(--gold);letter-spacing:.08em}
.lead{font-family:var(--title);font-size:21px;line-height:1.35;text-wrap:balance}
.sub{font-size:14px;color:var(--dim)}
.lab{font-size:13px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.btn{font-family:var(--title);font-size:21px;letter-spacing:.14em;width:100%;padding:10px 12px;background:var(--gold);color:var(--ink);border:2px solid var(--vellum);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:disabled{background:var(--royal);color:var(--dim);border-color:var(--royal2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--royal);color:var(--vellum);font-family:var(--jp);font-size:15px;letter-spacing:.04em;padding:8px;border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--vellum);outline-offset:2px}
button:disabled{cursor:not-allowed}
.statline{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--royal);padding:8px}
.statline div{display:flex;flex-direction:column;align-items:center;min-width:0;font-size:12px;color:var(--dim)}
.statline b{font-family:var(--num);font-size:12px;font-weight:400;color:var(--vellum);margin-top:2px}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmd{font:inherit;text-align:left;background:var(--royal);color:var(--vellum);border:1px solid var(--gold);padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cmd b{font-family:var(--title);font-weight:400;font-size:19px;color:var(--gold);line-height:1.25}
.cmd span{font-size:13px;color:var(--dim);line-height:1.35}
.cmd:disabled{opacity:.42;border-color:var(--royal2)}
.cmd.wide{grid-column:1/3}
.cmd .gain{color:var(--hp)}
.q{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mv{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-family:var(--title);font-size:clamp(21px,6.6vw,30px);line-height:1;min-width:0}
.mv small{font-family:var(--jp);font-size:10px;margin-top:3px}
.mW{background:var(--w)}.mH{background:var(--h)}.mC{background:var(--c)}.mG{background:var(--g)}.mX{background:var(--x)}
.mv.hid{background-color:var(--royal2);color:var(--gold);background-image:linear-gradient(45deg,var(--royal) 25%,transparent 25%,transparent 75%,var(--royal) 75%);background-size:10px 10px}
.mv.first{outline:2px solid var(--vellum);outline-offset:1px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.act{font:inherit;position:relative;border:1px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--ink);padding:7px 9px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;cursor:pointer;text-align:left;min-width:0}
.act .k{grid-row:1/3;font-family:var(--title);font-size:27px;line-height:1}
.act .nm{font-size:15px;white-space:nowrap}
.act .pv{font-size:12px;white-space:nowrap}
.act:disabled{opacity:.34}
.act.wide{grid-column:1/3}
details{background:var(--royal);padding:7px 10px;font-size:14px}
summary{cursor:pointer}
.mx{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{border:1px solid var(--royal2);padding:3px;text-align:center;white-space:nowrap;font-weight:400}
.tree{display:flex;flex-direction:column;gap:8px}
.branch{font-size:14px;color:var(--gold)}
.node{font:inherit;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--royal);color:var(--vellum);border:1px solid var(--royal2);padding:8px 10px;cursor:pointer;width:100%}
.node b{font-weight:400;font-size:15px}
.node span{font-size:13px;color:var(--dim);grid-column:1}
.node em{font-style:normal;font-family:var(--num);font-size:10px;color:var(--gold);grid-row:1/3;grid-column:2;align-self:center}
.node.done{border-color:var(--gold)}
.node:disabled{opacity:.55}
.node.done:disabled{opacity:1}
.hall{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center;background:var(--royal);padding:7px 10px;font-size:14px}
.hall .rank{font-family:var(--num);font-size:17px;color:var(--gold);grid-row:1/3}
.hall small{font-size:12px;color:var(--dim);grid-column:2/4}
.result{font-family:var(--title);font-size:36px;letter-spacing:.2em;text-align:center;color:var(--gold)}
.log{min-height:24px;font-size:14px;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.cutin{animation:none}.b i{transition:none}}

.statline.six{grid-template-columns:repeat(6,1fr)}
.tb{height:3px;background:var(--ink);position:relative}.tb i{position:absolute;inset:0 auto 0 0;background:var(--h)}
button.mv{font-family:var(--title);border:0;padding:0;cursor:pointer}
button.mv:disabled{cursor:default}
.mv.used{opacity:.26}
.q.seven{grid-template-columns:repeat(7,1fr);gap:4px}
.q.seven .mv small{font-size:8px;letter-spacing:-.5px;white-space:nowrap}
.bdg{position:absolute;top:-6px;right:-3px;background:var(--ink);color:var(--vellum);font-family:var(--jp);font-size:11px;line-height:1;padding:2px 3px}
.dist{display:flex;flex-direction:column;gap:3px;background:var(--royal);padding:7px 10px}
.dr{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.dr .n{text-align:right}
.dbar{height:9px;background:var(--ink)}.dbar i{display:block;height:100%}
.hints{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hint{background:var(--royal);text-align:center;font-family:var(--title);font-size:17px;line-height:1.1;padding:4px 2px;min-width:0}
.hint small{display:block;font-family:var(--num);font-size:8px;margin-top:3px;color:var(--dim)}
.hint.kn{color:var(--ink)}.hint.kn small{color:var(--ink);font-family:var(--jp);font-size:10px}
</style>

<div id="app">
  <div class="top"><h1>五手戦記</h1><button class="mini" id="snd" type="button">音 OFF</button></div>
  <div class="hud" id="hud"></div>
  <div class="arena" id="arena"><canvas id="stage" width="320" height="180"></canvas></div>
  <div class="panel" id="panel"></div>
</div>

<script>
/*LOGIC-START*/
const ACT={W:{n:'弱攻撃',k:'弱'},H:{n:'強攻撃',k:'強'},C:{n:'カウンター',k:'返'},G:{n:'防御',k:'防'}};
const MOVES=['W','H','C','G'];
const COMBOS=[
  {seq:'WWH',name:'三段打ち',bonus:8},
  {seq:'CH',name:'返し斬り',bonus:6},
  {seq:'GH',name:'溜め崩し',bonus:5},
  {seq:'WH',name:'繋ぎ',bonus:3},
  {seq:'WW',name:'連打',bonus:2}
];
const STREAK=[1,1,1.25,1.5,1.75,2], MAX_ROUNDS=8;
function bW(a,d){return Math.max(1,2+a.skl*.7+a.str*.3-d.def*.4)*(a.p.wind?1.15:1)*((a.p.ren&&a.last==='W')?1.3:1)}
function bH(a,d){return Math.max(2,5+a.str*1.5-d.def*.5)*(a.p.gou?1.3:1)*(a.p.fire?1.15:1)}
function base(x,y,ax,ay){
  if(ax==='W')return ay==='W'||ay==='S'?bW(x,y):ay==='H'?bW(x,y)*1.5:0;
  if(ax==='H')return ay==='H'?bH(x,y)*.6:ay==='G'?bH(x,y)*.7:ay==='S'?bH(x,y):0;
  if(ax==='C')return (ay==='W'?bW(x,y):ay==='H'?bH(y,x)*.7+x.skl*.8:0)*(x.p.iai?1.4:1);
  return 0;
}
function critRate(x){return Math.min(45,3+x.luck*1.5+(x.p.lucky?8:0))}
function comboAt(order,i,acted){for(const c of COMBOS){const n=c.seq.length;if(i-n+1<0)continue;let ok=true;for(let k=0;k<n;k++){const at=i-n+1+k;if(order[at]!==c.seq[k]||(acted&&!acted[at])){ok=false;break}}if(ok)return c}return null}
function resolveRound(A,B,po,eo,rng=Math.random){
  const fresh=f=>({...f,pz:0,stag:false,open:false,buff:false});
  const me=fresh(A),e=fresh(B),evs=[],st={p:0,e:0},acted={p:[],e:[]};
  let heal=0;
  if(me.p.cleric&&me.hp<me.max){heal=Math.min(me.max-me.hp,Math.max(3,Math.round(me.max*.08)));me.hp+=heal}
  const stagger=(y,x,d,act,ev,key)=>{
    y.pz+=d*(act==='H'?1.5:1)*(x.p.brk?1.4:1);
    if(y.pz>=y.tou&&y.hp>0){y.pz=0;if(y.p.guard&&!y.shieldUsed){y.shieldUsed=true;ev.shield=true}else{y.stag=true;ev['stag'+key]=true}}
  };
  for(let i=0;i<5;i++){
    const aa=me.stag?'S':po[i],ab=e.stag?'S':eo[i];
    me.stag=false;e.stag=false;acted.p[i]=aa!=='S';acted.e[i]=ab!=='S';
    const ev={slot:i,pa:aa,ea:ab,po:po[i],eo:eo[i],toP:0,toE:0,critP:false,critE:false,comboP:null,comboE:null,streakP:0,streakE:0,fin:i===4,stagP:false,stagE:false,shield:false,assists:[]};
    const vE=base(me,e,aa,ab),vP=base(e,me,ab,aa);
    if(vE>0&&vP===0){st.p++;st.e=0}else if(vP>0&&vE===0){st.e++;st.p=0}else if(vE>0&&vP>0){st.p=0;st.e=0}
    const calc=(x,y,v,key,order,solo)=>{
      if(v<=0)return [0,null,false];
      const c=solo?comboAt(order,i,acted[key]):null;
      let d=.6*(v+(c?c.bonus:0))*STREAK[Math.min(st[key],5)]*(i===4?1.5:1)*(y.open?1.5:1)*(x.buff?1.3:1)*((x.p.gya&&x.hp/x.max<=.3)?1.4:1);
      const crit=rng()*100<critRate(x);if(crit)d*=1.75;
      return [Math.max(1,Math.round(d)),c,crit];
    };
    const [toE,cP,crP]=calc(me,e,vE,'p',po,vP===0);
    const [toP,cE,crE]=calc(e,me,vP,'e',eo,vE===0);
    ev.toE=toE;ev.toP=toP;ev.comboP=cP;ev.comboE=cE;ev.critP=crP;ev.critE=crE;ev.streakP=st.p;ev.streakE=st.e;
    me.open=false;e.open=false;if(toE)me.buff=false;if(toP)e.buff=false;
    me.hp=Math.max(0,me.hp-toP);e.hp=Math.max(0,e.hp-toE);
    if(toE)stagger(e,me,toE,aa,ev,'E');
    if(toP)stagger(me,e,toP,ab,ev,'P');
    if(aa==='C'&&ab==='G')me.open=true;
    if(ab==='C'&&aa==='G')e.open=true;
    if(aa==='G'&&ab==='W'&&me.p.tek)me.buff=true;
    if(ab==='G'&&aa==='H'&&me.p.kuz){e.pz+=12}
    if(me.p.kyu&&aa==='H'&&toE>0&&me.hp>0)me.hp=Math.min(me.max,me.hp+Math.round(toE*.15));
    if(me.p.archer&&toE>0&&st.p>=2&&e.hp>0){const d=Math.max(1,Math.round(me.skl*.6));e.hp=Math.max(0,e.hp-d);ev.assists.push(['archer',d])}
    if(me.p.mage&&ev.stagE&&e.hp>0){const d=Math.max(1,Math.round((me.str+me.skl)*.4));e.hp=Math.max(0,e.hp-d);ev.assists.push(['mage',d])}
    me.last=aa;e.last=ab;
    ev.hpP=me.hp;ev.hpE=e.hp;ev.pzP=me.pz;ev.pzE=e.pz;
    evs.push(ev);
    if(me.hp<=0||e.hp<=0)break;
  }
  return {me,e,evs,heal};
}
function curW(e){const w={...(e.w2&&e.hp<=e.max/2?e.w2:e.w)};if(e.adapt)for(const k in e.adapt)w[k]+=e.adapt[k];return w}
function slotDist(e,i){const w=curW(e);if(e.bias)w[e.bias[i%5]]*=2.5;const s=MOVES.reduce((n,k)=>n+w[k],0),o={};MOVES.forEach(k=>o[k]=w[k]/s);return o}
function overall(e){const o={W:0,H:0,C:0,G:0};for(let i=0;i<5;i++){const d=slotDist(e,i);MOVES.forEach(k=>o[k]+=d[k]/5)}return o}
function sampleOrder(e,r=Math.random){const out=[];for(let i=0;i<5;i++){const d=slotDist(e,i);let x=r(),c='G';for(const k of MOVES){if(x<d[k]){c=k;break}x-=d[k]}out.push(c)}return out}
function adaptTo(e,order){const n={W:0,H:0,C:0,G:0};order.forEach(a=>n[a]++);const top=MOVES.slice().sort((a,b)=>n[b]-n[a])[0],reply={W:'C',H:'C',C:'G',G:'H'}[top];e.adapt=e.adapt||{};e.adapt[reply]=(e.adapt[reply]||0)+1.5;return top}
function dealHand(deck,r=Math.random){const a=[];for(const k of MOVES)for(let i=0;i<deck[k];i++)a.push(k);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,7)}
function foeStats(t){return {max:Math.round(46+t*14),str:Math.round(5+t*2.3),skl:Math.round(4+t*1.8),def:Math.round(3+t*1.2),luck:Math.round(2+t*.4),tou:Math.round(24+t*5)}}
function fighter(s,p={}){return {...s,hp:s.max,tou:Math.round(s.tou*(p.ken?1.3:1)),pz:0,stag:false,open:false,buff:false,last:null,shieldUsed:false,p}}
function foe(def,t){return {...fighter(foeStats(t+(def.up||0)),{}),w:def.w,w2:def.w2||null,bias:def.bias||null,adapt:{}}}
function scoreOf(u,perks,gates,clear){return Math.round(u.max/3+(u.str+u.skl+u.def)*1.5+u.luck+u.tou/3+perks*6+gates*12+(clear?30:0))}
function rankOf(s){return [['S',170],['A',135],['B',105],['C',80],['D',55],['E',0]].find(([,n])=>s>=n)[0]}
function soulOf(r){return r.days+r.wins*3+r.gates*15+(r.clear?40:0)}
function trainGain(k,b){return k==='max'?8+b*2:k==='tou'?6+b*2:k==='luck'?2+b:3+b}
function forgeCost(lv){return {ore:lv+1,gold:20+20*lv}}
function greatChance(u){return Math.min(60,10+u.luck*2)}
/*LOGIC-END*/

const $=s=>document.querySelector(s);
const KEY='goshu-senki-v3',OLDKEY='goshu-senki-v2';
const STAT={max:'HP',str:'力',skl:'技',def:'守',luck:'運',tou:'強靭'};
const P={
  gob:{skin:'#7fae4a',hair:'#3d5a22',armor:'#6e5a3a',leg:'#4d3f2a',ears:1},
  skel:{skin:'#e6e1cf',hair:'#e6e1cf',armor:'#3a3650',leg:'#e6e1cf',ribs:1},
  orc:{skin:'#6f8a5a',hair:'#2a2a2a',armor:'#5e4630',leg:'#3e3020',ears:1,wide:1},
  witch:{skin:'#c9c7e8',hair:'#32204f',armor:'#3f2a6e',leg:'#2a1b4d',hat:1,robe:1},
  dk:{skin:'#3a3a48',hair:'#b53232',armor:'#2c2c3a',leg:'#1c1c28',helm:1,cape:'#6d1f2c'},
  drake:{skin:'#a33b3b',hair:'#5c1f2a',armor:'#7d2b33',leg:'#5c1f2a',ears:1,cape:'#a33b3b'}
};
const F={
  gob:{name:'ゴブリン',kind:'gob',t:'A',w:{W:5,H:2,C:.5,G:1.5},bias:'WWHWH',tip:'弱攻撃が多い'},
  skel:{name:'骸骨兵',kind:'skel',t:'S',w:{W:2,H:1,C:4,G:2},bias:'GCWCH',tip:'カウンターを狙う'},
  orc:{name:'オーク',kind:'orc',t:'A',w:{W:1,H:5,C:.5,G:2},bias:'GHGHH',tip:'力任せの強攻撃'},
  witch:{name:'沼の魔女',kind:'witch',t:'L',w:{W:2,H:2,C:3,G:3},bias:'CGCWH',tip:'奥義をためる'},
  dk:{name:'黒騎士',kind:'dk',t:'L',w:{W:3,H:3,C:2,G:2},bias:'WCHGH',tip:'攻防の切り替えが速い'},
  drake:{name:'竜人',kind:'drake',t:'S',w:{W:2,H:3,C:3,G:2},bias:'GHWCH',tip:'読みにくい'}
};
const G_={

    const s=ac.createBufferSource();s.buffer=b;s.connect(g);g.gain.value=kind==='big'?.32:.2;s.start(t);return;

function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(hitstop>0){hitstop-=dt;dt=0}
  const ms=dt*1000*spd;
  tweens=tweens.filter(tw=>{tw.t+=ms;tw.fn(Math.min(tw.t/tw.d,1));if(tw.t>=tw.d){tw.res();return false}return true});
  const list=view==='duel'&&duel?[...(duel.c||[]),duel.e,duel.p]:[...Object.values(field.e),...Object.values(field.p)].sort((a,b)=>a.ground-b.ground);
  for(const f of list)if(f.flash>0)f.flash-=dt;
  parts=parts.filter(q=>{q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(!q.noG)q.vy+=260*dt;return q.l>0});
  floats=floats.filter(q=>{q.l-=dt;q.y-=24*dt;return q.l>0});
  if(shake>0)shake=Math.max(0,shake-dt*22);
  if(white>0)white=Math.max(0,white-dt*3);
  ctx.save();
  if(shake>0&&!reduce)ctx.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));
  if(bg)ctx.drawImage(bg,0,0);
  for(const f of list)drawUnit(f,now);
  fxs=fxs.filter(e=>{e.t+=ms;const k=Math.min(e.t/e.ttl,1);e.draw(k);return k<1});
  for(const q of parts){ctx.fillStyle=q.c;ctx.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s)}
  ctx.font='11px "Press Start 2P",monospace';ctx.textAlign='center';
  for(const q of floats){ctx.fillStyle='#0c1026';for(const [a,b] of [[1,1],[-1,1],[1,-1],[-1,-1],[2,2]])ctx.fillText(q.txt,Math.round(q.x)+a,Math.round(q.y)+b);ctx.fillStyle=q.c;ctx.fillText(q.txt,Math.round(q.x),Math.round(q.y))}
  ctx.restore();

}

async function runRound(){

  B.order=B.slots.map(x=>B.hand[x]);B.phase='fight';B.cur=-1;B.show={me:B.me.hp,e:B.e.hp,pzP:0,pzE:0};

  if(r.heal){B.show.me=Math.min(B.me.max,B.show.me+r.heal);callout(COMPS.cleric.n+'の治癒 +'+r.heal)}
  renderDuel();await wait(170);
  for(const ev of r.evs){
    B.cur=ev.slot;B.done[ev.slot]=undefined;renderDuel();await wait(ev.fin?120:50);
    await playEx(ev);
    B.show.me=ev.hpP;B.show.e=ev.hpE;B.done[ev.slot]=ev.toE&&!ev.toP?'勝':ev.toP&&!ev.toE?'負':ev.toP&&ev.toE?'分':'－';renderDuel();

  $('#panel').innerHTML=`<div class="result">${clear?'踏破':'旅の終わり'}</div>
    <div class="hall"><span class="rank">${rank}</span><span>${name}</span><span class="n">${score}</span><small>関門 ${r.gates} ／ 勝利 ${r.wins} ／ ${r.days}日</small></div>
    <p class="lead" style="text-align:center">魂片 +${gain}</p>${opened?`<p class="sub" style="text-align:center">${opened}</p>`:''}
    <button class="btn" type="button" data-a="tree">継承ツリーへ</button><button class="btn alt" type="button" data-a="home">拠点に戻る</button>`;
}
function doForge(){
  const fc=forgeCost(run.weapon);if(run.ore<fc.ore||run.gold<fc.gold)return;
  run.ore-=fc.ore;run.gold-=fc.gold;
  const great=Math.random()*100<greatChance(run.hero),m=great?2:1;
  run.hero.str+=2*m;run.hero.skl+=m;run.weapon++;
  if(run.weapon===3||run.weapon===5)run.pendingAffix=pick(Object.keys(AFFIX).filter(a=>!run.affix.includes(a)),3);
  townScene();pulse(great?'大成功':'錬成 +'+run.weapon);if(great)snd('win');
  setTimeout(advance,420);
}
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,i=+b.dataset.i;if(!a)return;
  if(a==='hero')renderHome({t:b.dataset.t,r:+$('#panel').dataset.reg});
  else if(a==='region')renderHome({t:$('#panel').dataset.sel,r:+b.dataset.r});
  else if(a==='start'){snd('tap');startRun(b.dataset.t,+b.dataset.r)}
  else if(a==='tree')renderTree();
  else if(a==='hall')renderHall();
  else if(a==='home')renderHome();
  else if(a==='buy-tree'){const n=TREE.flatMap(x=>x[1]).find(x=>x.id===b.dataset.id);if(meta.soul>=n.c){meta.soul-=n.c;meta.tree[n.id]=1;save();snd('win');renderTree()}}
  else if(a==='day')renderDay();
  else if(a==='v-train')renderTrain();
  else if(a==='v-wild')renderWild();
  else if(a==='v-shop')renderShop();
  else if(a==='v-forge')renderForge();
  else if(a==='v-tavern')renderTavern();
  else if(a==='forge')doForge();
  else if(a==='affix'){run.affix.push(b.dataset.v);run.pendingAffix=null;snd('win');save();renderDay()}
  else if(a==='hire'){const c=COMPS[b.dataset.v];if(run.gold>=c.c&&run.comps.length<2){run.gold-=c.c;run.comps.push(b.dataset.v);snd('win');advance()}}
  else if(a==='train'){const k=b.dataset.k,g=trainGain(k,has('tr1')?1:0);run.hero[k]+=g;run.sta-=trainCost();pulse(STAT[k]+'+'+g);setTimeout(advance,300)}
  else if(a==='rest'){run.sta=Math.min(100,run.sta+50);advance()}
  else if(a==='wild'){const w=run.wild[i];startBattle(F[w.k],w.lv,{gate:false,reward:{gold:w.gold,stat:w.stat,amt:w.amt,ore:w.ore}})}
  else if(a==='gate'){const R=REGIONS[run.region],n=gateDays().indexOf(nextGate());startBattle(G_[R.gates[n]],R.base+(n+1)*3-1,{gate:true})}
  else if(a==='buy'){const it=run.shop[i];if(it.p){const p=PERKS[it.p];run.gold-=p.c;run.perks.push(it.p)}else if(it.add){run.gold-=30;run.deck[it.add]++}else if(it.rm){run.gold-=30;run.deck[it.rm]--}else{const g=GEAR[it.g];run.gold-=g.c;if(g.sta)run.sta=Math.min(100,run.sta+g.sta);else if(g.ore)run.ore+=g.ore;else for(const [k,v] of Object.entries(g.b))run.hero[k]+=v}it.sold=true;snd('tap');save();renderShop()}
  else if(a==='shop-done'){if(has('peddler')){renderDay()}else advance()}
  else if(a==='ev'){applyB(EVENTS[run.event].o[i][2]);run.event=null;save();renderDay()}
  else if(a==='cc'){const u=run.hero,o=CC[u.t].find(x=>x.id===b.dataset.o);applyB(o.b);u.cc=o.id;u.cls=o.cls;u.pal.cape=o.cape;run.cc=false;snd('win');save();renderDay()}
  else if(a==='next-day')advance();
  else if(a==='abandon')endRun(false);
  else if(a==='slot'){const n=B.slots.indexOf(null);if(n>=0){B.slots[n]=i;snd('tap');renderDuel()}}
  else if(a==='unslot'){B.slots[i]=null;renderDuel()}
  else if(a==='lock'){if(B.slots.every(x=>x!==null))runRound()}
  else if(a==='speed'){spd=spd>2?1.35:2.8;renderDuel()}
});
route();
requestAnimationFrame(frame);
connect();
</script>
</script>
